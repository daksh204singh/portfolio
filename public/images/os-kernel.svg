<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#f3f4f6"/>
  
  <!-- CPU/Processor representation -->
  <rect x="150" y="100" width="100" height="80" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CPU</text>
  
  <!-- Memory blocks -->
  <rect x="50" y="50" width="60" height="40" rx="4" fill="#10b981" stroke="#059669" stroke-width="1"/>
  <text x="80" y="75" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Lock</text>
  
  <rect x="50" y="100" width="60" height="40" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <text x="80" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">CV</text>
  
  <rect x="50" y="150" width="60" height="40" rx="4" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1"/>
  <text x="80" y="175" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">RW</text>
  
  <!-- Threads -->
  <circle cx="300" cy="80" r="15" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
  <text x="300" y="85" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">T1</text>
  
  <circle cx="300" cy="120" r="15" fill="#06b6d4" stroke="#0891b2" stroke-width="2"/>
  <text x="300" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">T2</text>
  
  <circle cx="300" cy="160" r="15" fill="#84cc16" stroke="#65a30d" stroke-width="2"/>
  <text x="300" y="165" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">T3</text>
  
  <!-- Connection lines -->
  <line x1="110" y1="70" x2="150" y2="120" stroke="#6b7280" stroke-width="2" stroke-dasharray="4"/>
  <line x1="110" y1="120" x2="150" y2="120" stroke="#6b7280" stroke-width="2" stroke-dasharray="4"/>
  <line x1="110" y1="170" x2="150" y2="120" stroke="#6b7280" stroke-width="2" stroke-dasharray="4"/>
  
  <line x1="250" y1="80" x2="285" y2="80" stroke="#6b7280" stroke-width="2" stroke-dasharray="4"/>
  <line x1="250" y1="120" x2="285" y2="120" stroke="#6b7280" stroke-width="2" stroke-dasharray="4"/>
  <line x1="250" y1="160" x2="285" y2="160" stroke="#6b7280" stroke-width="2" stroke-dasharray="4"/>
  
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="16" font-weight="bold">OS Kernel Synchronization</text>
  <text x="200" y="250" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">C • MIPS Assembly • GDB</text>
</svg> 